spring:
  application:
    name: NextStep
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sobrietydb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Lokalt: update (Spring hanterar schema). Produktion: sätt JPA_DDL_AUTO=validate
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # baseline-on-migrate=true låter Flyway köra på befintliga databaser utan att krascha
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    # Inaktivera Flyway lokalt om det behövs: sätt FLYWAY_ENABLED=false
    enabled: ${FLYWAY_ENABLED:true}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

mail:
  sender:
    email: ${MAIL_SENDER_EMAIL:noreply@nextstep.se}
    name: ${MAIL_SENDER_NAME:NextStep}

server:
  port: 8080

# AI Coach Configuration (Anthropic Claude / Groq)
ai:
  coach:
    enabled: ${AI_COACH_ENABLED:false}
    max-tokens: ${AI_COACH_MAX_TOKENS:500}
    temperature: ${AI_COACH_TEMPERATURE:0.7}
    # Anthropic Claude
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    claude-model: ${CLAUDE_MODEL:claude-haiku-4-5}
    # Groq (gratis under utveckling) - används som default om GROQ_API_KEY är satt
    # Sätt USE_GROQ=false + ANTHROPIC_API_KEY för att använda Claude i produktion
    use-groq: ${USE_GROQ:true}
    groq-api-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:llama-3.1-8b-instant}
