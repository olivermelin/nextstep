spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${AI_COACH_MODEL:gpt-4}
          max-tokens: ${AI_COACH_MAX_TOKENS:500}
          temperature: ${AI_COACH_TEMPERATURE:0.7}
  mail:
    host: localhost
    port: 1025
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  port: 8080

# AI Coach Configuration
ai:
  coach:
    enabled: ${AI_COACH_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${AI_COACH_MODEL:gpt-4}
    max-tokens: ${AI_COACH_MAX_TOKENS:500}
    temperature: ${AI_COACH_TEMPERATURE:0.7}
    # Anthropic Claude
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    claude-model: ${CLAUDE_MODEL:claude-haiku-4-5}
    # Groq (gratis under utveckling – sätt USE_GROQ=true + GROQ_API_KEY)
    use-groq: ${USE_GROQ:false}
    groq-api-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:llama-3.1-8b-instant}

