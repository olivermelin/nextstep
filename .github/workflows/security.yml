name: Security Scan

on:
  schedule:
    # Varje måndag kl 08:00 svensk tid (07:00 UTC)
    - cron: "0 7 * * 1"
  workflow_dispatch: # Möjlighet att köra manuellt från GitHub

jobs:
  backend-scan:
    name: Backend – OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run OWASP Dependency-Check
        working-directory: backend
        run: mvn dependency-check:check --no-transfer-progress
        continue-on-error: true # Spara rapport även om sårbarhet hittas

      - name: Upload rapport
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: backend/target/dependency-check-report/
          retention-days: 30

  frontend-scan:
    name: Frontend – npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Spara audit-rapport
        working-directory: frontend
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload rapport
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 30
