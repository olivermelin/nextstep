name: CI

# Körs på varje pull request mot main samt på push till main.
# Detta är gaten som gör automatisk merge av Dependabot-PR:er säker –
# utan den mergas beroendeuppdateringar helt overifierat.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Avbryt tidigare körningar på samma branch när en ny push kommer
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend – build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Bygg och kör tester
        working-directory: backend
        run: mvn -B verify --no-transfer-progress
        # Tester kör mot H2 in-memory (profil "test") – ingen extern databas behövs

      - name: Spara testrapporter vid fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend – build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installera beroenden
        working-directory: frontend
        run: npm ci

      - name: Bygg
        working-directory: frontend
        run: npm run build

  frontend-quality:
    name: Frontend – lint & test (informativ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installera beroenden
        working-directory: frontend
        run: npm ci

      # TODO: ta bort continue-on-error när lint-felen är åtgärdade,
      # och lägg till jobbet som required check i branch protection.
      - name: ESLint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      # TODO: ta bort continue-on-error när vitest-sviten är grön igen.
      - name: Vitest
        working-directory: frontend
        run: npm run test
        continue-on-error: true
